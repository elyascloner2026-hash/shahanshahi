services:
  - type: web
    name: shahanshahi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      - key: DATABASE_PATH
        value: shahanshahi.db
      - key: FIGHT_COOLDOWN
        value: "300"
      - key: WEBHOOK_SECRET
        generateValue: true
